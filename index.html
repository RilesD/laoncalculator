<!DOCTYPE.HTML>
<html>
  <head>
    <title>Simple Calculator</title>
    <style>
      html, body {
        background-color: #000000;
        color: #ffffff;
        text-align: center;
        min-height: 100vh;
      }
        </style>
    <script>

         function calc() {
           let PV=document.getElementById("num1").value;
           let n=document.getElementById("num2").value;
           let r=document.getElementById("num3").value;
           let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**-(n*12));
           document.getElementById("rslt").innerHTML=P.toFixed(2);
         }

      
    </script>
  </head>
  <body>
    <br>
    <h2>My JavaScript Powered Loan Calculator</h2>
    <p>Loan Amount: How much would you like to borrow?
      <br>
      <input id="num1" style="width: 120px;">
    <br>
    <br>
      Years: How quickly would you like to pay it back?
    <br>
      <input id="num2" style="width: 120px;">
    <br>
    <br>
      Interest rate:
    <br>
      <input id="num3" style="width: 120px;">
    <br>
    <br>
    <button onclick="calc()">Calculate Monthly Payment</button>
 
    
    </p>
    <p>
      Result: <span id="rslt"></span>
    </p>
 
  </body>
</html>
